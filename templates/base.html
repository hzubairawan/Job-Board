<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Resume Screener{% endblock %} · TalentMatch</title>
  <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">
  <div id="page-progress" class="page-progress" aria-hidden="true"></div>

  {% block body %}{% endblock %}

  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2000">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast app-toast toast-{{ category }}" role="alert" aria-live="assertive" aria-atomic="true"
             data-bs-delay="{{ 8000 if category == 'danger' else 5000 }}">
          <div class="d-flex">
            <div class="toast-body d-flex align-items-start gap-2">
              <i class="bi bi-{{ {'success':'check-circle-fill','danger':'exclamation-octagon-fill','warning':'exclamation-triangle-fill','info':'info-circle-fill'}.get(category,'info-circle-fill') }} mt-1"></i>
              <span>{{ message }}</span>
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      {% endfor %}
    {% endwith %}
  </div>

  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" id="confirmTitle">Please confirm</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="confirmMessage"></div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmOk">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="loading-overlay d-none" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="spinner-border text-teal" aria-hidden="true"></div>
      <div class="fw-semibold mt-3" id="loading-text">Working…</div>
      <div class="small text-muted">This only takes a moment.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
