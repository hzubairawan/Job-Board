{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body_class %}auth-body{% endblock %}

{% block body %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <h2 class="fw-bold">{{ title }}</h2>
  <p class="text-muted mb-4">{{ message }}</p>
  <div class="d-flex gap-2 justify-content-center">
    <a href="{{ dashboard_url_for(current_user) }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>
      {{ 'Go to dashboard' if current_user.is_authenticated else 'Back to home' }}</a>
    <button type="button" class="btn btn-outline-secondary" data-history-back>Go back</button>
  </div>
</div>
{% endblock %}
